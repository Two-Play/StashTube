name: CI

# Pull requests run through `pull_request` only, and `push` only for develop,
# where the work comes together, so a commit doesn't run everything twice.
# main only receives develop through a release pull request: develop's push
# already checked that code, so the pull request from develop to main skips
# the checks, and the merge into main runs release.yml instead.
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version the project is developed with; pubspec.lock pins the
  # dependencies resolved with it.
  FLUTTER_VERSION: 3.47.6

jobs:
  analyze-test:
    name: Analyze and test
    # The builds need this job, so they are skipped with it.
    if: github.event_name != 'pull_request' || github.head_ref != 'develop' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Fails if pubspec.lock doesn't match pubspec.yaml (run flutter pub get).
      - run: flutter pub get --enforce-lockfile
      - name: Generated code is up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/gen
      # Fails on documents that don't match Stash's schema (1.8), and on
      # committed types that are out of date (the generator is pinned by
      # pubspec.lock).
      - name: GraphQL types match the schema
        run: |
          flutter pub run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- 'lib/**/*.graphql.dart' \
            || { echo "::error::Generated GraphQL code is out of date; run build_runner and commit it."; exit 1; }
      # dart analyze, not flutter analyze: only it runs riverpod_lint.
      - run: dart analyze
      - run: flutter test
      # The release's version numbering (tool/release/next_version.py).
      - run: python3 -m unittest discover -s tool/release

  build-android:
    name: Build Android
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-ios:
    name: Build iOS
    needs: analyze-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --debug --no-codesign
