name: Release

# Every push to main (the merged release pull request from develop) is a
# release (14.3): signed APKs per ABI, a universal APK, an AAB, a universal
# APK without Google Cast (`-foss`, the F-Droid variant from
# tool/fdroid_prepare.sh, same key), an unsigned IPA for AltStore/SideStore
# and SHA256SUMS as a GitHub release, plus a TestFlight upload
# (testflight.yml). Obtainium and IzzyOnDroid pick the APKs up from there;
# afterwards altstore.yml updates the AltStore source. Betas become
# pre-releases.
#
# The pipeline sets the version: tool/release/next_version.py counts on from
# the highest tag, steered by the pull request's labels (release:stable,
# release:patch/minor/major, release:beta), and the release creates the tag
# vX.Y.Z. The workflow's run number is the build number (versionCode).
# `version:` in pubspec.yaml is only for local builds.
#
# Signing secrets: ANDROID_KEYSTORE_BASE64 (the upload keystore, base64),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.

on:
  push:
    branches: [main]

# One release at a time, none cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  actions: read

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: v${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run keeps the version the first attempt tagged.
          tagged=$(git tag --points-at HEAD --list 'v*' | head -1)
          if [ -n "$tagged" ]; then
            version=${tagged#v}
          else
            # The highest version, 1.2.0 above 1.2.0-beta.1.
            latest=$(git -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname | head -1)
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null) | .labels[].name] | unique | .[]')
            echo "Latest tag: ${latest:-none}; labels: $(echo $labels)"
            version=$(python3 tool/release/next_version.py "$latest" $labels)
          fi
          echo "Version: $version (build ${{ github.run_number }})"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    name: Signed Android packages
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The signing secrets are missing; a release must not be signed with the debug key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get --enforce-lockfile

      # The run number only grows, so every release gets a higher versionCode
      # (per-ABI APKs add 1000 × the ABI's number on top).
      - name: Build
        run: |
          build=(--build-name "$VERSION" --build-number ${{ github.run_number }})
          flutter build apk --release --split-per-abi "${build[@]}"
          flutter build apk --release "${build[@]}"
          flutter build appbundle --release "${build[@]}"

      - name: Collect packages
        run: |
          mkdir dist
          out=build/app/outputs
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/flutter-apk/app-$abi-release.apk" "dist/stashtube-$TAG-$abi.apk"
          done
          cp "$out/flutter-apk/app-release.apk" "dist/stashtube-$TAG-universal.apk"
          cp "$out/bundle/release/app-release.aab" "dist/stashtube-$TAG.aab"

      # The same app without Google Cast (Play Services), signed with the same
      # key and versionCode as the universal APK, so the two replace each
      # other. fdroid_prepare.sh drops the signing for F-Droid; put it back.
      - name: Build without Google Cast
        run: |
          tool/fdroid_prepare.sh
          git checkout android/app/build.gradle.kts
          flutter build apk --release --build-name "$VERSION" --build-number ${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "dist/stashtube-$TAG-foss.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/
          if-no-files-found: error

  ios:
    name: Unsigned IPA (AltStore)
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile

      # AltStore and SideStore sign the app with the user's Apple ID when
      # installing. They compare the app's version and build number with the
      # source's, so both are set explicitly: the version without "-beta.N"
      # (Flutter would turn 1.0.0-beta.5 into 1.0.0.5), as on TestFlight, and
      # the run number, which the file name carries to
      # tool/altstore/make_source.py.
      - name: Build
        run: |
          flutter build ios --release --no-codesign --build-name "${VERSION%%-*}" --build-number ${{ github.run_number }}
          mkdir -p ipa/Payload dist
          cp -R build/ios/iphoneos/Runner.app ipa/Payload/
          (cd ipa && zip -qry "../dist/stashtube-$TAG-${{ github.run_number }}.ipa" Payload)

      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Creates the tag on the released commit.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "StashTube $TAG" --generate-notes "${flags[@]}"

  # Tags and releases made with the workflow token don't trigger other
  # workflows, so TestFlight and the AltStore source run from here.
  testflight:
    name: TestFlight
    needs: version
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/testflight.yml
    with:
      version: ${{ needs.version.outputs.version }}
      build-number: ${{ github.run_number }}
    secrets: inherit

  altstore:
    name: AltStore source
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/altstore.yml
