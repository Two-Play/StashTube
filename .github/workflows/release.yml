name: Release

# Pushing a tag like v1.2.0 (matching `version:` in pubspec.yaml) builds
# signed Android packages and publishes them as a GitHub release (14.3):
# APKs per ABI, a universal APK, an AAB, a universal APK without Google Cast
# (`-foss`, the F-Droid variant from tool/fdroid_prepare.sh, same key), an
# unsigned IPA for AltStore/SideStore and SHA256SUMS. Obtainium and
# IzzyOnDroid pick the APKs up from there; afterwards altstore.yml updates
# the AltStore source. Tags with a "-" (v1.2.0-beta.1) become pre-releases.
#
# Signing secrets: ANDROID_KEYSTORE_BASE64 (the upload keystore, base64),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  android:
    name: Signed Android packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Version matches the tag
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::pubspec.yaml has version $version, but the tag is $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The signing secrets are missing; a release must not be signed with the debug key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get --enforce-lockfile

      # The run number only grows, so every release gets a higher versionCode
      # (per-ABI APKs add 1000 × the ABI's number on top).
      - name: Build
        run: |
          flutter build apk --release --split-per-abi --build-number ${{ github.run_number }}
          flutter build apk --release --build-number ${{ github.run_number }}
          flutter build appbundle --release --build-number ${{ github.run_number }}

      - name: Collect packages
        run: |
          mkdir dist
          out=build/app/outputs
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/flutter-apk/app-$abi-release.apk" "dist/stashtube-$GITHUB_REF_NAME-$abi.apk"
          done
          cp "$out/flutter-apk/app-release.apk" "dist/stashtube-$GITHUB_REF_NAME-universal.apk"
          cp "$out/bundle/release/app-release.aab" "dist/stashtube-$GITHUB_REF_NAME.aab"

      # The same app without Google Cast (Play Services), signed with the same
      # key and versionCode as the universal APK, so the two replace each
      # other. fdroid_prepare.sh drops the signing for F-Droid; put it back.
      - name: Build without Google Cast
        run: |
          tool/fdroid_prepare.sh
          git checkout android/app/build.gradle.kts
          flutter build apk --release --build-number ${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "dist/stashtube-$GITHUB_REF_NAME-foss.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/
          if-no-files-found: error

  ios:
    name: Unsigned IPA (AltStore)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile

      # AltStore and SideStore sign the app with the user's Apple ID when
      # installing. They compare the app's version and build number with the
      # source's, so both are set explicitly: the version without "-beta.N"
      # (Flutter would turn 1.0.0-beta.5 into 1.0.0.5), as on TestFlight, and
      # the run number, which the file name carries to
      # tool/altstore/make_source.py.
      - name: Build
        run: |
          version=$(sed -n 's/^version: *\([^+-]*\).*/\1/p' pubspec.yaml)
          flutter build ios --release --no-codesign --build-name "$version" --build-number ${{ github.run_number }}
          mkdir -p ipa/Payload dist
          cp -R build/ios/iphoneos/Runner.app ipa/Payload/
          (cd ipa && zip -qry "../dist/stashtube-$GITHUB_REF_NAME-${{ github.run_number }}.ipa" Payload)

      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "StashTube $GITHUB_REF_NAME" --generate-notes --verify-tag "${flags[@]}"

  # A release made with the workflow token doesn't trigger other workflows,
  # so the AltStore source is updated from here.
  altstore:
    name: AltStore source
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/altstore.yml
