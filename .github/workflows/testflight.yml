name: TestFlight

# Builds the iOS app and uploads it to App Store Connect, where it shows up in
# TestFlight (14.3). release.yml runs it for every release, and it runs by
# hand ("Run workflow") for the selected branch.
#
# Signing is Xcode's automatic signing with an App Store Connect API key, so
# no certificates or profiles are stored here. Secrets: APPSTORE_KEY_ID,
# APPSTORE_ISSUER_ID, APPSTORE_KEY_P8 (the .p8 file's content, plain or
# base64), APPLE_TEAM_ID. The key needs the Admin role, which lets Xcode
# create the cloud-managed distribution certificate.
#
# The release passes its version and build number (its run number). By
# hand, the version is the "version" input or else the highest tag's, and
# the build number <last release run>.<this run>, which stays above the
# last release's build and below the next one's. App Store versions may only
# contain numbers and dots, so 1.0.0-beta.4 is uploaded as 1.0.0.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      build-number:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. 1.2.0); empty = the highest tag's
        required: false

permissions:
  contents: read
  actions: read

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  ios:
    name: Upload to TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags, for the version of a run by hand.
          fetch-depth: 0
          fetch-tags: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD: ${{ inputs.build-number }}
        run: |
          version=$INPUT_VERSION
          if [ -z "$version" ]; then
            # The highest version, 1.2.0 above 1.2.0-beta.1 (the release tags
            # are on main, which develop doesn't contain).
            version=$(git -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname | head -1)
          fi
          version=${version#v}
          version=${version%%-*}
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$version is not a version like 1.2.0."
            exit 1
          fi
          build=$INPUT_BUILD
          if [ -z "$build" ]; then
            release=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?per_page=1" \
              --jq '.workflow_runs[0].run_number // 0')
            build="$release.${{ github.run_number }}"
          fi
          echo "Version $version, build $build"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: API key
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$KEY_P8" ]; then
            echo "::error::The App Store Connect secrets are missing."
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          if [[ "$KEY_P8" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_P8" > "$key"
          else
            echo "$KEY_P8" | base64 --decode > "$key"
          fi
          echo "KEY_PATH=$key" >> "$GITHUB_ENV"

      - run: flutter pub get --enforce-lockfile

      # Generates the Flutter build settings (version, build number) and the
      # pods; the signed archive comes from xcodebuild, which can sign in with
      # the API key.
      - name: Build
        run: |
          flutter build ios --release --no-codesign \
            --build-name ${{ steps.version.outputs.name }} \
            --build-number ${{ steps.version.outputs.build }}

      - name: Archive and upload
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          auth=(-allowProvisioningUpdates
            -authenticationKeyPath "$KEY_PATH"
            -authenticationKeyID "$KEY_ID"
            -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            "${auth[@]}"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}"

      # xcodebuild only prints a summary; the reason (e.g. Apple's API answer)
      # is in the distribution logs. Lines with tokens are left out.
      - name: Distribution log
        if: failure()
        run: |
          find "${TMPDIR:-/tmp}" -path '*.xcdistributionlogs/*' -name '*.log' 2>/dev/null \
            | while read -r log; do
                echo "== $(basename "$log")"
                grep -iE 'error|fail|status|reason|message' "$log" \
                  | grep -viE 'authorization|bearer|token' | tail -60
              done

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
