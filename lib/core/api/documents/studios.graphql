fragment StudioFields on Studio {
  ...StudioRef
  url
  scene_count
  parent_studio { ...StudioRef }
}

fragment StudioDetails on Studio {
  ...StudioFields
  details
  child_studios { ...StudioRef scene_count }
}

query FindStudios($filter: FindFilterType) {
  findStudios(filter: $filter) {
    count
    studios { ...StudioFields }
  }
}

query FindStudio($id: ID!) {
  findStudio(id: $id) { ...StudioDetails }
}

# Which of the studio channel's tabs have content (sub-studios included).
query StudioMediaCounts($id: ID!) {
  findStudio(id: $id) {
    id
    image_count(depth: -1)
    gallery_count(depth: -1)
  }
}

mutation StudioEdit($input: StudioUpdateInput!) {
  studioUpdate(input: $input) { ...StudioDetails }
}

# Stash 0.25 and later; queried separately so older versions only lose the
# studio's favorite button.
query StudioFavorite($id: ID!) {
  findStudio(id: $id) { id favorite }
}

mutation StudioSetFavorite($id: ID!, $favorite: Boolean!) {
  studioUpdate(input: { id: $id, favorite: $favorite }) { id favorite }
}
