# Groups replaced movies in Stash v0.27.
fragment GroupFields on Group {
  id
  name
  date
  duration
  front_image_path
  scene_count
  studio { ...StudioRef }
}

query FindGroups($filter: FindFilterType) {
  findGroups(filter: $filter) {
    count
    groups { ...GroupFields }
  }
}

query FindGroup($id: ID!) {
  findGroup(id: $id) { ...GroupFields synopsis }
}

# "Add to group" (PL-1): the groups a scene is in, with its position in each.
fragment SceneGroupRef on SceneGroup {
  group { id }
  scene_index
}

query SceneGroups($id: ID!) {
  findScene(id: $id) {
    id
    groups { ...SceneGroupRef }
  }
}

# The group's last scene by position, to append after it.
query LastGroupScene($group_id: ID!) {
  findScenes(
    scene_filter: {groups: {value: [$group_id], modifier: INCLUDES}}
    filter: {sort: "group_scene_number", direction: DESC, per_page: 1}
  ) {
    scenes {
      id
      groups { ...SceneGroupRef }
    }
  }
}

mutation SceneSetGroups($id: ID!, $groups: [SceneGroupInput!]) {
  sceneUpdate(input: {id: $id, groups: $groups}) {
    id
    groups { ...SceneGroupRef }
  }
}

mutation GroupCreate($name: String!) {
  groupCreate(input: {name: $name}) { ...GroupFields }
}
