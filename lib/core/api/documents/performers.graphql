fragment PerformerFields on Performer {
  id
  name
  disambiguation
  image_path
  country
  birthdate
  gender
  favorite
  rating100
  scene_count
}

query FindPerformers($filter: FindFilterType, $performer_filter: PerformerFilterType) {
  findPerformers(filter: $filter, performer_filter: $performer_filter) {
    count
    performers { ...PerformerFields }
  }
}

query FindPerformer($id: ID!) {
  findPerformer(id: $id) { ...PerformerFields details }
}

# The channel's about tab and which of its tabs have content; separate from
# FindPerformer so the page shows even if a server lacks one of the fields.
query PerformerProfile($id: ID!) {
  findPerformer(id: $id) {
    id
    alias_list
    death_date
    ethnicity
    hair_color
    eye_color
    height_cm
    weight
    measurements
    career_length
    tattoos
    piercings
    image_count
    gallery_count
  }
}

query PerformerUrls($id: ID!) {
  findPerformer(id: $id) { id urls }
}

mutation PerformerEdit($input: PerformerUpdateInput!) {
  performerUpdate(input: $input) { ...PerformerFields details }
}

mutation PerformerSetFavorite($id: ID!, $favorite: Boolean!) {
  performerUpdate(input: { id: $id, favorite: $favorite }) { id favorite }
}
